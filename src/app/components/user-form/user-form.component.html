<div class="card" tabindex="-1" style="display: block;">
    <div class="card-content">
        <div class="card-header">
            <h5 class="card-title"> {{user.id >
                0 ? 'Editar':
                'Agregar'}} Usuario</h5>
        </div>
        <div class="card-body">
            <form (ngSubmit)="onSubmit(userForm)" #userForm="ngForm">
                <div class="card">
                    <div class="card-body">
                        <div>
                            <input name="name" class="form-control my-2" placeholder="Nombre" [(ngModel)]="user.name"
                                #name="ngModel"> <!--required-->
                            @if (errors?.name) {
                            <div class="text-danger"> {{errors.name}} </div>
                            }
                            <!-- @if (name.invalid && (name.dirty || name.touched)) {
                            @if (name.errors!['required']) {
                            <div class="text-danger">
                                El nombre es requerido
                            </div>
                            }
                            } -->
                        </div>
                        <div>
                            <input name="lastname" class="form-control my-2" placeholder="Apellido"
                                [(ngModel)]="user.lastname" #lastname="ngModel"> <!--required-->
                            @if (errors?.lastname) {
                            <div class="text-danger"> {{errors.lastname}} </div>
                            }
                            <!-- @if (lastname.invalid && (lastname.dirty || lastname.touched)) {
                            @if (lastname.errors!['required']) {
                            <div class="text-danger" role="alert">
                                El apellido es requerido
                            </div>
                            }
                            } -->
                        </div>
                        <div>
                            <input name="email" class="form-control my-2" placeholder="Correo" [(ngModel)]="user.email"
                                type="email" #email="ngModel"><!--required email-->
                            @if (errors?.email) {
                            <div class="text-danger"> {{errors.email}} </div>
                            }
                            <!-- @if (email.invalid && (email.dirty || email.touched)) {
                            @if (email.errors!['required']) {
                            <div class="text-danger" role="alert">
                                El correo es requerido
                            </div>
                            }
                            @if (email.errors!['email']) {
                            <div class="text-danger" role="alert">
                                El correo no es valido
                            </div>
                            }
                            } -->
                        </div>
                        <div>
                            <input name="username" class="form-control my-2" placeholder="Usuario"
                                [(ngModel)]="user.username" #username="ngModel"><!--required minlength="4"-->
                            @if (errors?.username) {
                            <div class="text-danger"> {{errors.username}} </div>
                            }
                            <!-- @if (username.invalid && (username.dirty || username.touched)) {
                            @if (username.errors!['required']) {
                            <div class="text-danger" role="alert">
                                El usuario es requerido
                            </div>
                            }
                            @if (username.errors!['minlength']) {
                            <div class="text-danger" role="alert">
                                Numero maximo 4 caracteres
                            </div>
                            }
                            } -->
                        </div>
                        @if (user.id === 0) {
                        <div>
                            <input name="password" class="form-control my-2" placeholder="Contraseña" type="password"
                                [(ngModel)]="user.password" #password="ngModel"><!--required minlength="4"-->
                            @if (errors?.password) {
                            <div class="text-danger"> {{errors.password}} </div>
                            }
                            <!-- @if (password.invalid && (password.dirty || password.touched)) {
                                @if (password.errors!['required']) {
                                <div class="text-danger" role="alert">
                                    El nombre es requerido
                                </div>
                                }
                                @if (password.errors!['minlength']) {
                                <div class="text-danger" role="alert">
                                    Numero maximo 4 caracteres
                                </div>
                                }
                                } -->
                        </div>
                        }
                    </div>
                    <div class="card-footer">
                        <button class="btn btn-primary m-2" type="submit"> {{user.id >
                            0 ? 'Editar':
                            'Agregar'}}
                        </button><!-- [disabled]="userForm.invalid"-->
                        <button class="btn btn-info m-2" (click)="onClear(userForm)">Clear</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
